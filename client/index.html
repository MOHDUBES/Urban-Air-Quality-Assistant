<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Air Quality Assistant — Breathe Smarter During Winter Smog</title>
  <meta name="description"
    content="A GenAI-powered smog defense assistant providing tailored low-emission routines, indoor air quality hacks, and direct personal impact metrics for families and vulnerable communities." />
  <meta name="theme-color" content="#0F766E" />

  <!-- No-flash theme initializer: runs before first paint -->
  <script>
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem('uaqa-theme') || '{}');
        var isDark = typeof stored.isDark === 'boolean'
          ? stored.isDark
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var fontSize = ['sm', 'md', 'lg', 'xl'].includes(stored.fontSize) ? stored.fontSize : 'md';
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
        } else {
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
        }
        root.classList.remove('high-contrast');
        root.classList.add('font-size-' + fontSize);
      } catch (e) { }
    })();
  </script>

  <!-- Favicon & Icons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
